name: Generate OSS CI Health Reports

on:
  push:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

env:
  RUNS_INDEX: runs-oss
  EVENTS: schedule,push

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate OSS reports
        env:
          OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
          OPENSEARCH_USER: ${{ secrets.OPENSEARCH_USER }}
          OPENSEARCH_PASS: ${{ secrets.OPENSEARCH_PASS }}
        run: |
          go run . report \
            --runs-index ${{ env.RUNS_INDEX }} \
            --events ${{ env.EVENTS }} \
            --output-dir ./report-out
      - name: Prepare Jekyll site
        run: |
          rm -rf site _site
          mkdir -p site
          cp -R ./report-out/. ./site/
          if [ -f ./site/Home.md ]; then
            mv ./site/Home.md ./site/index.md
          fi
          cat > ./site/_config.yml <<'EOF'
          title: OSS CI Health Reports
          markdown: kramdown
          EOF
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
