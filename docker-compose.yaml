services:
  opensearch-node:
    image: opensearchproject/opensearch:latest # This should be the same image used for opensearch-node1 to avoid issues
    container_name: opensearch-node
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - bootstrap.memory_lock=true
      - cluster.initial_cluster_manager_nodes=opensearch-node
      - "OPENSEARCH_JAVA_OPTS=-Xms4G -Xmx4G"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASS}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - opensearch-config:/usr/share/opensearch/config
    ports:
      - 127.0.0.1:9200:9200 # REST API
      - 127.0.0.1:9600:9600 # Performance Analyzer
    expose:
      - "9200"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --cacert /usr/share/opensearch/config/root-ca.pem
          --resolve node-0.example.com:9200:127.0.0.1
          --user "admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
          https://node-0.example.com:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      opensearch-net:
        aliases:
          - node-0.example.com
  corgi:
    image: golang:1.23-bookworm
    container_name: corgi
    working_dir: /workspace
    depends_on:
      opensearch-node:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: https://node-0.example.com:9200
      OPENSEARCH_USER: ${OPENSEARCH_USER}
      OPENSEARCH_PASS: ${OPENSEARCH_PASS}
      SSL_CERT_FILE: /tmp/ca-certificates.pem
      TARGET_RUNS_INDEX: ${TARGET_RUNS_INDEX}
      TARGET_RATES_INDEX: ${TARGET_RATES_INDEX}
      TARGET_REPOSITORY: ${TARGET_REPOSITORY}
      TARGET_BRANCH: ${TARGET_BRANCH}
      TZ: UTC
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - .:/workspace
      - opensearch-config:/opensearch-config:ro
    command:
      - sh
      - -ec
      - |
        apt-get update
        apt-get install --yes --no-install-recommends curl jq make
        rm -rf /var/lib/apt/lists/*
        cat /etc/ssl/certs/ca-certificates.crt \
          /opensearch-config/root-ca.pem \
          > /tmp/ca-certificates.pem
        exec tail -f /dev/null
    networks:
      - opensearch-net
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest # Make sure the version of opensearch-dashboards matches the version of opensearch installed on other nodes
    container_name: opensearch-dashboards
    depends_on:
      opensearch-node:
        condition: service_healthy
    ports:
      - 127.0.0.1:5601:5601 # Map host port 5601 to container port 5601
    expose:
      - "5601" # Expose port 5601 for web access to OpenSearch Dashboards
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch-node:9200"]' # Define the OpenSearch nodes that OpenSearch Dashboards will query
    networks:
      - opensearch-net

volumes:
  opensearch-data:
  opensearch-config:

networks:
  opensearch-net:
